<script>
        // Simple Interaction Logic for Demonstration
        const targetBtn = document.getElementById('btn-4');
        const stars = document.querySelectorAll('[data-icon="star"]');
        let clickCount = 0;

        if(targetBtn) {
            targetBtn.addEventListener('click', () => {
                if(clickCount < 3) {
                    // Update Star
                    stars[clickCount].classList.add('fill', 'text-secondary');
                    stars[clickCount].classList.remove('text-outline-variant');
                    stars[clickCount].style.animation = 'popIn 0.3s ease-out forwards';
                    
                    clickCount++;
                    
                    // Gamified Feedback on Button
                    targetBtn.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        targetBtn.style.transform = '';
                    }, 150);

                    // Success State
                    if(clickCount === 3) {
                        setTimeout(() => {
                            alert("¡Excelente! Has completado el entrenamiento del número 4.");
                            // Reset for demo purposes
                            clickCount = 0;
                            stars.forEach(star => {
                                star.classList.remove('fill', 'text-secondary');
                                star.classList.add('text-outline-variant');
                                star.style.animation = '';
                            });
                        }, 500);
                    }
                }
            });
        }
    </script>
