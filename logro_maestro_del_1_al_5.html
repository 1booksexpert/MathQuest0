<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background-color: #0059bb; /* primary */
            top: -20px;
            opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { opacity: 1; top: -20px; transform: rotate(0deg); }
            100% { opacity: 0; top: 100vh; transform: rotate(360deg); }
        }
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(108, 248, 187, 0.5); } /* secondary-container */
            100% { box-shadow: 0 0 30px rgba(108, 248, 187, 0.8); }
        }
      </style>

<body class="bg-surface text-on-surface min-h-screen overflow-hidden flex flex-col items-center justify-center relative font-body-md">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center justify-center w-full px-gutter max-w-container-max mx-auto text-center">
<!-- Celebration Graphic -->
<div class="relative mb-8 bounce-in">

<div class="relative w-48 h-48 md:w-64 md:h-64 bg-surface-container-lowest rounded-full shadow-lg flex items-center justify-center border-4 border-secondary-container z-10">
<!-- Using an image to represent the trophy/badge -->
<div class="w-full h-full rounded-full overflow-hidden flex items-center justify-center p-4">
<span class="material-symbols-outlined text-[80px] md:text-[120px] text-tertiary" style="font-variation-settings: 'FILL' 1;">
                         emoji_events

</div>
<!-- Number Badges Orbiting -->

<div class="absolute top-1/2 -right-10 w-20 h-20 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container font-display-lg shadow-md transform -translate-y-1/2 rotate-[-10deg]">5</div>
</div>

<!-- Headline -->

<span class="font-code-sm text-code-sm mt-1 text-[10px]">Pedagogía</span>
</button>
<script>
        // Simple confetti script
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#0059bb', '#6cf8bb', '#712edd', '#ba1a1a', '#ffdad6'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize properties
                const left = Math.random() * 100 + 'vw';
                const animationDuration = Math.random() * 3 + 2 + 's';
                const animationDelay = Math.random() * 2 + 's';
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.left = left;
                confetti.style.animationDuration = animationDuration;
                confetti.style.animationDelay = animationDelay;
                confetti.style.backgroundColor = color;
                
                container.appendChild(confetti);
            }
        });
    </script>
