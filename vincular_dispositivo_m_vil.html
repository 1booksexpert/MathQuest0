<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MathQuest - Link Device</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface": "#121c2a",
                      "surface-container-high": "#dee9fc",
                      "secondary-fixed": "#6ffbbe",
                      "primary": "#0059bb",
                      "on-tertiary-fixed": "#250059",
                      "on-background": "#121c2a",
                      "surface-container": "#e6eeff",
                      "outline-variant": "#c1c6d7",
                      "primary-container": "#0070ea",
                      "on-primary-container": "#fefcff",
                      "surface-container-low": "#eff4ff",
                      "outline": "#717786",
                      "surface-dim": "#d0dbed",
                      "on-primary-fixed": "#001a41",
                      "tertiary": "#712edd",
                      "background": "#f8f9ff",
                      "secondary-fixed-dim": "#4edea3",
                      "tertiary-fixed-dim": "#d3bbff",
                      "surface": "#f8f9ff",
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "on-secondary-fixed-variant": "#005236",
                      "on-secondary-fixed": "#002113",
                      "surface-variant": "#d9e3f6",
                      "tertiary-container": "#8b4ef7",
                      "inverse-surface": "#27313f",
                      "secondary-container": "#6cf8bb",
                      "on-tertiary": "#ffffff",
                      "on-surface-variant": "#414754",
                      "on-tertiary-fixed-variant": "#5b00c5",
                      "surface-container-lowest": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "primary-fixed-dim": "#adc7ff",
                      "secondary": "#006c49",
                      "on-primary-fixed-variant": "#004493",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#d9e3f6",
                      "surface-tint": "#005bc0",
                      "inverse-on-surface": "#eaf1ff",

                      "on-tertiary-container": "#fffbff",
                      "inverse-primary": "#adc7ff",

                      "tertiary-fixed": "#ebddff",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-max": "1280px",
                      "margin-mobile": "16px",
                      "unit": "4px",
                      "gutter": "24px",
                      "base": "16px"
              },
              "fontFamily": {
                      "code-sm": [
                              "JetBrains Mono"
                      ],
                      "body-md": [
                              "Hanken Grotesk"
                      ],
                      "display-lg": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg-mobile": [

                      ]
              },
              "fontSize": {
                      "code-sm": [
                              "14px",

                      "body-md": [
                              "16px",

                      "headline-lg-mobile": [

                                      "lineHeight": "32px",

              }
      },
          },
        }

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
        
        /* Scanner animation */
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        .scanner-line {
            animation: scan 3s infinite linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-gutter py-base w-full max-w-container-max mx-auto bg-surface-container-high shadow-sm docked full-width top-0 z-10">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">MathQuest</h1>
</div>
<button aria-label="Settings" class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-margin-mobile pt-8 pb-32 flex-grow flex flex-col items-center">
<div class="text-center mb-8 w-full">
<h2 class="font-display-lg text-display-lg text-primary mb-2">Link Device</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Connect your phone to play anywhere.</p>
</div>
<!-- Main Interaction Area - Bento Style -->
<div class="w-full grid grid-cols-1 gap-6">
<!-- Primary Action: QR Scanner -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg border border-surface-variant overflow-hidden flex flex-col h-80 relative">
<div class="p-4 bg-primary text-on-primary flex justify-between items-center z-10">
<span class="font-headline-lg-mobile text-headline-lg-mobile">Scan QR Code</span>
<span class="material-symbols-outlined text-3xl">qr_code_scanner</span>
</div>
<div class="flex-grow relative bg-inverse-surface flex items-center justify-center">
<!-- Faux Camera Feed -->
<img class="absolute inset-0 w-full h-full object-cover opacity-60" data-alt="A simulated camera view showing a slightly blurred desktop computer screen displaying a bright blue QR code for an educational game. The lighting is soft and focused, conveying a sense of looking through a modern smartphone camera lens ready to scan. The aesthetic is clean, technological, and welcoming." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgEK1G63BuvcgaJwP32NwWEnaskumgAN4kK4xs_77hkVldd3xSyezrUy8fEC5Y6ZvjGgooBaZH3bzjWkuqeKzxYXaQ477T2vLSOIw-0tnHNAoeyKc7Dy9MbRJC4Hjd5VTMau8ElUk9-f9xClDAWdyPpURAtnlQFVt1OaKBKATHoI7WrIFt8Ilu8RdaM4gE2h25i-wda-7RFQZvrQv4bngUWAXokWU-oRKyQ70l56FMZO1pajsP3Qgz"/>
<!-- Scanner Overlay -->
<div class="relative w-48 h-48 border-4 border-primary rounded-lg z-20 flex items-center justify-center overflow-hidden">
<!-- Corner brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-secondary-container"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-secondary-container"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-secondary-container"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-secondary-container"></div>
<!-- Animated Scanning Line -->
<div class="scanner-line absolute left-0 right-0 h-1 bg-secondary-container shadow-[0_0_10px_#6cf8bb]"></div>
<!-- Hint Text inside scanner -->
<p class="font-body-md text-body-md text-white text-center px-4 bg-black/50 rounded-full py-1">Point at screen</p>
</div>
</div>
</div>
<!-- Divider -->
<div class="flex items-center w-full my-2">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="px-4 font-body-md text-body-md text-on-surface-variant font-bold">OR</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Secondary Action: Pairing Code -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-6">
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary text-2xl filled">keyboard</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Enter Pairing Code</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">Find the 6-digit code on your desktop screen.</p>
<!-- Jumbo Input -->
<div class="flex gap-2 justify-between mb-6">
<input class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 bg-surface focus:bg-surface-container-lowest transition-colors" maxlength="1" type="text" value="8"/>
<input class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 bg-surface focus:bg-surface-container-lowest transition-colors" maxlength="1" type="text" value="4"/>
<input class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 bg-surface focus:bg-surface-container-lowest transition-colors" maxlength="1" type="text" value="2"/>
<span class="font-display-lg text-display-lg text-outline-variant self-center">-</span>
<input autofocus="" class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-primary rounded-lg focus:border-primary focus:ring-0 bg-surface-container-lowest transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 bg-surface focus:bg-surface-container-lowest transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-16 text-center font-display-lg text-display-lg text-primary border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 bg-surface focus:bg-surface-container-lowest transition-colors" maxlength="1" type="text"/>
</div>
<!-- Jumbo Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-lg-mobile text-headline-lg-mobile py-4 rounded-full shadow-[0_4px_8px_rgba(0,89,187,0.2)] transition-transform active:scale-95 flex justify-center items-center gap-2 relative overflow-hidden group min-h-[64px]">
<div class="absolute top-0 left-0 right-0 h-1 bg-white/20"></div>
<span>Link Account</span>
<span class="material-symbols-outlined">link</span>
</button>
</div>
<!-- Success State Simulation (Normally Hidden) -->
<div class="bg-secondary-container rounded-xl shadow-lg border border-secondary p-6 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-secondary rounded-full flex items-center justify-center mb-4 shadow-[0_4px_12px_rgba(0,108,73,0.3)]">
<span class="material-symbols-outlined text-on-secondary text-5xl filled">check_circle</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-container mb-2">Device Linked!</h3>
<p class="font-body-md text-body-md text-on-secondary-container opacity-80 mb-4">Your progress is syncing...</p>
<!-- Progress Bar -->
<div class="w-full bg-secondary/20 h-2 rounded-full overflow-hidden">
<div class="bg-secondary h-full rounded-full w-3/4 shadow-[0_0_8px_#006c49]"></div>
</div>
</div>
</div>
</main>
<!-- Contextual Nav Suppression applied: BottomNavBar omitted as this is a transactional/task-focused screen (linking device) -->
</body></html>
