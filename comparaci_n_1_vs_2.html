<style>
        /* Custom animations for interaction feedback */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Hide scrollbar for immersive app feel */

            -ms-overflow-style: none;

<!-- Interactive Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardUno = document.getElementById('card-uno');
            const cardDos = document.getElementById('card-dos');
            const audioBtn = document.getElementById('audio-prompt');
            
            const feedbackUno = document.getElementById('feedback-uno');
            const feedbackDos = document.getElementById('feedback-dos');
            const particlesDos = document.getElementById('particles-dos');

            // Audio prompt simulation
            audioBtn.addEventListener('click', () => {
                audioBtn.firstElementChild.classList.add('animate-pop');
                setTimeout(() => {
                    audioBtn.firstElementChild.classList.remove('animate-pop');
                }, 300);
            });

            // Incorrect choice logic
            cardUno.addEventListener('click', () => {
                // Visual shake
                cardUno.classList.add('animate-shake');
                // Show red feedback
                feedbackUno.classList.remove('opacity-0');
                feedbackUno.classList.add('opacity-100');
                
                setTimeout(() => {
                    cardUno.classList.remove('animate-shake');
                    feedbackUno.classList.remove('opacity-100');
                    feedbackUno.classList.add('opacity-0');
                }, 800);
            });

            // Correct choice logic
            cardDos.addEventListener('click', () => {
                // Pop animation
                cardDos.classList.add('animate-pop');
                
                // Lock interactions to prevent double tapping
                cardUno.style.pointerEvents = 'none';
                cardDos.style.pointerEvents = 'none';

                // Show green success feedback
                feedbackDos.classList.remove('opacity-0');
                feedbackDos.classList.add('opacity-100');
                
                // Show particles/glow
                particlesDos.classList.remove('opacity-0');
                particlesDos.classList.add('opacity-100');

                // Simulate moving to next level after delay
                setTimeout(() => {
                    // Reset for demo purposes (normally this would navigate)
                    cardDos.classList.remove('animate-pop');
                    feedbackDos.classList.remove('opacity-100');
                    feedbackDos.classList.add('opacity-0');
                    particlesDos.classList.remove('opacity-100');
                    particlesDos.classList.add('opacity-0');
                    
                    cardUno.style.pointerEvents = 'auto';
                    cardDos.style.pointerEvents = 'auto';
                }, 2000);
            });
        });
    </script>
