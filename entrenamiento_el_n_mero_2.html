<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom animations for tactile feedback */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
        .sparkle-element {
            position: absolute;
            animation: sparkle 1s forwards;
        }

        /* Tactile button shadow */
        .btn-tactile {
            box-shadow: 0 8px 0 var(--btn-shadow-color, #c1c6d7), 0 12px 10px rgba(0,0,0,0.1);
            transition: all 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--btn-shadow-color, #c1c6d7), 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>

<body class="bg-surface-bright text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center overflow-hidden touch-manipulation select-none">
<!-- Top Action Bar (Exit) - Minimal for focus -->
<div class="fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10">
<button class="w-12 h-12 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
<!-- Progress Bar -->
<div class="flex-1 mx-8 max-w-sm h-4 bg-surface-container-high rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-secondary w-1/4 rounded-full"></div>
</div>
<div class="w-12"></div> <!-- Spacer for centering -->
</div>
<!-- Main Canvas Area -->
<main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile flex flex-col items-center justify-center gap-12 mt-16 pb-32">
<!-- Audio Visualizer / Prompt -->
<div class="flex flex-col items-center gap-4 animate-pulse-soft cursor-pointer" onclick="playAudioCue()">
<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center shadow-lg shadow-primary-container/30">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 40px; transform: scale(1);">volume_up</span>
</div>
</div>
<!-- Central Illustration -->
<div class="relative w-full max-w-md aspect-square bg-surface-container-lowest rounded-4xl shadow-[0_8px_30px_rgba(0,0,0,0.05)] border-4 border-surface-container-high flex items-center justify-center p-8 overflow-hidden group">
<img class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" data-alt="A vibrant, hyper-clear, and friendly digital illustration of exactly two glossy red apples placed side by side. The style is clean, modern, and perfect for a toddler's educational app. Soft lighting, light mode aesthetic, no background clutter, emphasizing the concept of 'two' in a welcoming and tactile manner." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDtIe4961e3Rg8FJX5OU645Az6RueVUMsb9sDcLO5ef9-_yq3fKdUFAvx7pIv3p6hh-X1Hqn__B9DcUuNpFHzy3_mI_CxlbU-auptuFkM3zCFVTOx5bbv-4AJnxLifYQ_RQXRLpQuFLdUYbnKZWEPJ0dsrDf8JjlQNCVkOhME-IIQMJJPXIXcm8a7pbnmUFoSd9u9bVY4E9DrC7LAWcK5Z9uuKOh2DM6zTcQRKWhtk4mk8o1S9gWJl">
</div>
</main>
<!-- Simplified On-Screen Keyboard -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-4xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] p-6 pb-safe border-t-2 border-surface-container">
<div class="max-w-md mx-auto grid grid-cols-3 gap-6">
<!-- Number 1 -->
<button class="btn-tactile bg-surface-container-highest text-on-surface rounded-3xl flex items-center justify-center font-display-lg font-black h-48 border-8 border-surface-container-high text-[72px]" onclick="handleWrongAnswer(this)" style="--btn-shadow-color: #c1c6d7;">
                1
            </button>
<!-- Number 2 (Target) -->
<button class="btn-tactile bg-surface-container-highest text-on-surface rounded-3xl flex items-center justify-center font-display-lg font-black h-48 border-8 border-surface-container-high text-[72px]" onclick="handleCorrectAnswer()" style="--btn-shadow-color: #c1c6d7;">
                2
            </button>
<!-- Number 3 -->
<button class="btn-tactile bg-surface-container-highest text-on-surface rounded-3xl flex items-center justify-center font-display-lg font-black h-48 border-8 border-surface-container-high text-[72px]" onclick="handleWrongAnswer(this)" style="--btn-shadow-color: #c1c6d7;">
                3
            </button>
</div>
</div>
<!-- Success Feedback Overlay -->
<div class="fixed inset-0 bg-surface/90 backdrop-blur-sm z-50 hidden flex-col items-center justify-center" id="success-overlay">
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Sparkles will be injected here via JS -->
<div class="absolute inset-0" id="sparkle-container"></div>
<!-- Main Success Badge -->
<div class="bg-secondary text-on-secondary w-48 h-48 rounded-full flex flex-col items-center justify-center shadow-[0_0_50px_rgba(0,108,73,0.5)] border-8 border-secondary-container animate-pop-in">
<span class="material-symbols-outlined" style="font-size: 80px;">star</span>
<span class="font-headline-lg mt-2 tracking-wide">¡Muy bien!</span>
</div>
</div>
</div>
<script>
        function playAudioCue() {
            // Visual feedback for playing audio
            const icon = document.querySelector('.material-symbols-outlined.text-on-primary-container');
            icon.style.transform = 'scale(1.2)';
            setTimeout(() => { icon.style.transform = 'scale(1)'; }, 200);
            // In a real app, play 'Dos' sound here.
        }

        function handleWrongAnswer(btn) {
            // Gentle visual shake for wrong answer
            btn.classList.add('bg-error-container', 'text-on-error-container');
            btn.style.transform = 'translateX(-5px)';
            setTimeout(() => btn.style.transform = 'translateX(5px)', 100);
            setTimeout(() => btn.style.transform = 'translateX(-5px)', 200);
            setTimeout(() => btn.style.transform = 'translateX(0)', 300);
            
            setTimeout(() => {
                btn.classList.remove('bg-error-container', 'text-on-error-container');
            }, 800);
        }

        function handleCorrectAnswer() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            createSparkles();
            
            // Auto hide after a few seconds and proceed to next (simulated)
            setTimeout(() => {
                overlay.classList.remove('flex');
                overlay.classList.add('hidden');
            }, 3000);
        }

        function createSparkles() {
            const container = document.getElementById('sparkle-container');
            container.innerHTML = ''; // clear previous
            
            const colors = ['#6cf8bb', '#0070ea', '#8b4ef7', '#ffdad6'];
            
            for(let i=0; i<8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-element material-symbols-outlined';
                sparkle.innerText = 'auto_awesome';
                
                // Random positioning around the center
                const angle = (i / 8) * Math.PI * 2;
                const distance = 100 + Math.random() * 50;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                sparkle.style.left = `calc(50% + ${x}px - 15px)`;
                sparkle.style.top = `calc(50% + ${y}px - 15px)`;
                sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.fontSize = `${20 + Math.random() * 20}px`;
                sparkle.style.animationDelay = `${Math.random() * 0.3}s`;
                
                container.appendChild(sparkle);
            }
        }
        
        // Initial cue
        setTimeout(playAudioCue, 1000);
    </script>
