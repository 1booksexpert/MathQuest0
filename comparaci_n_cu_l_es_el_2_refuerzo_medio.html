<script>
        // Simple interaction for demo purposes
        document.querySelectorAll('button.jumbo-btn-shadow').forEach(button => {
            button.addEventListener('click', function() {
                // Remove borders from all
                document.querySelectorAll('button.jumbo-btn-shadow').forEach(b => {
                    b.classList.remove('border-secondary', 'border-error');
                    b.classList.add('border-surface-container');
                });
                
                // Add specific styling based on which is clicked (demo logic)
                if(this.textContent.includes('2')) {
                    this.classList.remove('border-surface-container', 'hover:border-primary-container');
                    this.classList.add('border-secondary', 'bg-surface-container-low');
                    
                    // Show success state
                    const hintIcons = this.querySelectorAll('.material-symbols-outlined');
                    hintIcons.forEach(icon => {
                        icon.classList.remove('text-error', 'opacity-30');
                        icon.classList.add('text-secondary', 'opacity-80', 'scale-125', 'transition-all');
                    });
                } else {
                    this.classList.remove('border-surface-container', 'hover:border-primary-container');
                    this.classList.add('border-error', 'bg-error-container');
                }
            });
        });
