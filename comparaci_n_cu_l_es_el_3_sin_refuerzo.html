<style>

<body class="bg-surface text-on-surface h-full flex flex-col items-center justify-center font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Intent implies a focused task (Linear/Transactional), navigation shell is suppressed. -->
<main class="w-full max-w-container-max px-margin-mobile md:px-gutter h-full flex flex-col items-center justify-center relative">
<!-- Top App Bar / Progress Area (Simplified for task focus) -->
<header class="absolute top-0 w-full pt-8 px-margin-mobile md:px-gutter flex items-center justify-between">
<button aria-label="Volver" class="flex items-center justify-center p-2 rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<!-- 3-Star Progress Bar -->
<div aria-label="Progreso: 3 de 3 estrellas" class="flex items-center gap-2">
<span class="material-symbols-outlined text-4xl text-secondary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-4xl text-secondary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-4xl text-secondary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<div class="flex flex-col items-center w-full max-w-2xl mt-16">
<!-- Instruction -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary text-center mb-12">
                ¿Cuál es el 3?
            </h1>
<!-- Jumbo Comparison Buttons -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
<!-- Option 1 (Number 3) -->
<button aria-label="Seleccionar el número 3" class="pulse-hover bg-surface-container-lowest text-on-surface border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary-container rounded-xl shadow-md hover:shadow-lg transition-all duration-300 flex flex-col items-center justify-center aspect-square md:aspect-[4/3] group relative overflow-hidden">
<!-- Ambient Top Glow for Level 2 (Interactive) feel -->
<div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-display-lg text-[120px] md:text-[160px] leading-none text-on-surface font-extrabold group-hover:text-primary transition-colors">
                        3
                    </span>
</button>
<!-- Option 2 (Number 1) -->
<button aria-label="Seleccionar el número 1" class="bg-surface-container-lowest text-on-surface border-2 border-transparent focus:border-primary focus:ring-4 focus:ring-primary-container rounded-xl shadow-md hover:shadow-lg transition-all duration-300 flex flex-col items-center justify-center aspect-square md:aspect-[4/3] group relative overflow-hidden">
<div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-display-lg text-[120px] md:text-[160px] leading-none text-on-surface font-extrabold group-hover:text-primary transition-colors">
                        1
                    </span>
</button>
</div>
<!-- Optional subtle hint text for screen readers or lower visual hierarchy -->
<p class="font-body-md text-body-md text-on-surface-variant mt-12 text-center opacity-70">
                Toca el número correcto para avanzar.
            </p>
</div>
</main>
<script>
        // Simple script to handle selection feedback (simulated)
        const buttons = document.querySelectorAll('button:not([aria-label="Volver"])');
        
        buttons.forEach(button => {
            button.addEventListener('click', function() {
                // Reset all
                buttons.forEach(b => {
                    b.classList.remove('ring-4', 'ring-secondary-container', 'border-secondary', 'ring-error-container', 'border-error');
                });
                
                const value = this.querySelector('span.font-display-lg').innerText.trim();
                
                if (value === '3') {
                    // Success state
                    this.classList.add('ring-4', 'ring-secondary-container', 'border-secondary', 'bg-surface-container-low');
                    this.querySelector('span.font-display-lg').classList.add('text-secondary');
                    
                    // Simulate advance
                    setTimeout(() => {
                        this.classList.add('scale-105');
                    }, 300);
                } else {
                    // Error state
                    this.classList.add('ring-4', 'ring-error-container', 'border-error');
                    
                    // Shake animation
                    this.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-10px)' },
                        { transform: 'translateX(10px)' },
                        { transform: 'translateX(-10px)' },
                        { transform: 'translateX(10px)' },
                        { transform: 'translateX(0)' }
                    ], {
                        duration: 400,
                        iterations: 1
                    });
                }
            });
        });
    </script>
