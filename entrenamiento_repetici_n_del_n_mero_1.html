<style>
        .star-pulse {
            animation: pulse-star 0.3s ease-in-out forwards;
        }
        @keyframes pulse-star {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 10px #ffeb3b); }
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px #fbc02d); color: #fbc02d;}
        }
        .btn-press {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-press:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 0 #004493, inset 0 4px 10px rgba(0,0,0,0.2) !important;
        }

<body class="bg-surface-container-low min-h-screen font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-margin-mobile overflow-hidden">
<!-- Top Navigation suppressed as this is a focused training/linear task screen -->
<main class="w-full max-w-[600px] bg-surface-container-lowest rounded-3xl shadow-lg p-6 sm:p-12 flex flex-col items-center gap-12 relative z-10">
<!-- Progress Bar (Stars) -->
<div class="w-full flex flex-col items-center gap-4">
<div class="flex gap-4 sm:gap-8 justify-center w-full max-w-sm mx-auto">
<span class="material-symbols-outlined text-outline-variant text-5xl sm:text-6xl transition-all duration-300" data-icon="star" data-weight="fill" id="star-1" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-outline-variant text-5xl sm:text-6xl transition-all duration-300" data-icon="star" data-weight="fill" id="star-2" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-outline-variant text-5xl sm:text-6xl transition-all duration-300" data-icon="star" data-weight="fill" id="star-3" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Repetition Counter -->
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface-variant bg-surface-container py-2 px-6 rounded-full inline-flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
<span id="counter-text">0 de 3</span>
</div>
</div>
<!-- Central Interaction Area -->
<div class="flex flex-col items-center justify-center gap-6 flex-1 w-full relative">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Uno</h1>
<div class="relative w-48 h-48 sm:w-64 sm:h-64 flex items-center justify-center">
<img class="object-contain w-full h-full drop-shadow-xl animate-[bounce_3s_infinite_ease-in-out]" data-alt="A stylized, highly saturated 3D render of a single red balloon floating against a pristine white background. The balloon has a glossy, tactile material reflecting soft studio lighting, creating a bright, gamified aesthetic suitable for a modern educational app. The style is clean, vibrant, and distraction-free." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCwfHwEFIGEoDR2z50PlY-UQwdh3N5nlGfZgvDAp6dcVsfwSS3xmgsSERXbZ1_IrEO9yRTomZiZg9KZxEsaK8hChWWz6FlN8RnDqKbyxtaSKAyaSi_amfZTxaqp7NMe_pM_NRDyrWKkQ2ymSKQv6bgULWXt6VN7M0QachXNw8i9F4-iZN15J-lEhqflNy7nmzjVl_Kpm-U7j84vllnqI2qzie_1VUGA3tC49yaLirKs-rRIvbgvJiL"/>
</div>

<!-- Giant Keypad -->

<button class="btn-press bg-primary hover:bg-primary-container text-on-primary rounded-[2rem] sm:rounded-[3rem] w-full max-w-[280px] sm:max-w-[320px] aspect-square flex items-center justify-center shadow-[0_12px_0_0_#004493,0_15px_20px_rgba(0,0,0,0.2)] relative overflow-hidden group border-4 border-[#3385ff]" id="main-btn">
<!-- Subtle inner top glow for 3D effect -->
<div class="absolute inset-x-0 top-0 h-1/4 bg-white/20 rounded-t-full blur-md"></div>
<span class="font-display-lg text-[120px] sm:text-[160px] font-[900] leading-none text-on-primary drop-shadow-md z-10">1</span>

<!-- Confetti Canvas (hidden by default, used for completion) -->
<canvas class="fixed inset-0 w-full h-full pointer-events-none z-50 opacity-0 transition-opacity duration-500" id="confetti"></canvas>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            let progress = 0;
            const maxProgress = 3;
            const btn = document.getElementById('main-btn');
            const counterText = document.getElementById('counter-text');
            const stars = [
                document.getElementById('star-1'),
                document.getElementById('star-2'),
                document.getElementById('star-3')
            ];

            btn.addEventListener('click', () => {
                if (progress < maxProgress) {
                    // Update progress
                    stars[progress].classList.remove('text-outline-variant');
                    // Add bright yellow/gold for the filled star
                    stars[progress].style.color = '#fbc02d'; 
                    stars[progress].classList.add('star-pulse');
                    
                    progress++;
                    counterText.textContent = `${progress} de ${maxProgress}`;
                    
                    // Simple haptic feedback if available
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }

                    if (progress === maxProgress) {
                        triggerSuccess();
                    }
                }
            });

            function triggerSuccess() {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                
                // Show confetti overlay (simple visual cue for now)
                const canvas = document.getElementById('confetti');
                canvas.classList.remove('opacity-0');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                // Very basic confetti simulation loop
                let particles = [];
                for(let i=0; i<100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height - canvas.height,
                        r: Math.random() * 6 + 2,
                        dx: Math.random() * 2 - 1,
                        dy: Math.random() * 3 + 2,
                        color: ['#0070ea', '#6cf8bb', '#ffeb3b', '#ba1a1a'][Math.floor(Math.random() * 4)]
                    });
                }
                
                function draw() {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                        p.x += p.dx;
                        p.y += p.dy;
                        if(p.y > canvas.height) p.y = -10;
                    });
                    if(progress === maxProgress) requestAnimationFrame(draw);
                }
                draw();

                // Reset after 3 seconds
                setTimeout(() => {
                    progress = 0;
                    counterText.textContent = `0 de ${maxProgress}`;
                    stars.forEach(s => {
                        s.classList.add('text-outline-variant');
                        s.style.color = '';
                        s.classList.remove('star-pulse');
                    });
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    canvas.classList.add('opacity-0');
                }, 3000);
            }
        });
    </script>
