<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_55 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_55" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_55');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Scene: Jumbo Interaction
// Interactive giant hand/finger tapping a large "2" button.

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);

// Jumbo Button "2"
const buttonGroup = new THREE.Group();
const baseGeo = new THREE.BoxGeometry(2, 2, 0.5);
const baseMat = new THREE.MeshPhongMaterial({ color: 0xff4d4d }); // Red base
const base = new THREE.Mesh(baseGeo, baseMat);
buttonGroup.add(base);

const numGeo = new THREE.TorusGeometry(0.5, 0.2, 16, 32); // Simple representation of '2' or circular element
const numMat = new THREE.MeshPhongMaterial({ color: 0x4da6ff }); // Blue number color
const num = new THREE.Mesh(numGeo, numMat);
num.position.z = 0.4;
buttonGroup.add(num);

scene.add(buttonGroup);

// Hand/Finger (Cylinder + Sphere)
const fingerGroup = new THREE.Group();
const fingerGeo = new THREE.CylinderGeometry(0.3, 0.4, 3, 32);
const fingerMat = new THREE.MeshPhongMaterial({ color: 0xffdbac }); // Skin tone
const finger = new THREE.Mesh(fingerGeo, fingerMat);
finger.rotation.z = Math.PI / 4;
fingerGroup.add(finger);
fingerGroup.position.set(2, 2, 2);
scene.add(fingerGroup);

camera.position.z = 5;

let clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Finger tap motion
    const tap = Math.abs(Math.sin(t * 4));
    fingerGroup.position.set(2 - tap * 1.5, 2 - tap * 1.5, 2 - tap);
    
    // Button squash effect
    if (tap > 0.8) {
        buttonGroup.scale.z = 0.7;
    } else {
        buttonGroup.scale.z = 1.0;
    }

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_55 -->
</body>
</html>
